[project]
name = "voyage"
version = "0.1.0"
description = "Voyage: a production-like B2B travel API with planted vulnerabilities, used as HAWK's target"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "pyjwt>=2.10",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voyage"]
