[project]
name = "hawk"
version = "0.1.0"
description = "HAWK: Heuristic Agent for Web Knowledge, agentic real-time DAST"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.9",
  "google-genai>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "dbos>=2.0",
  "duckdb>=1.1",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
crawl = ["playwright>=1.48"]
cloud = ["google-cloud-bigquery>=3.27", "google-cloud-pubsub>=2.27"]

[project.scripts]
hawk = "hawk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawk"]
